<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Glow / Border -->
  <path d="M50 5 L88 20 C88 58 50 92 50 92 C50 92 12 58 12 20 Z" 
        fill="url(#innerGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />
  <!-- Circuit Nodes -->
  <circle cx="50" cy="18" r="3" fill="#00D9FF" />
  <path d="M50 21 L50 32" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" />
  <circle cx="28" cy="38" r="2.5" fill="#10B981" />
  <path d="M30 38 L38 38" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="72" cy="38" r="2.5" fill="#10B981" />
  <path d="M70 38 L62 38" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
  <!-- Monogram AD -->
  <text x="50" y="64" 
        text-anchor="middle" 
        fill="#00D9FF" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="28" 
        letter-spacing="-1">AD</text>
  <path d="M35 72 L65 72" stroke="url(#shieldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
